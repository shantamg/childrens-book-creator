# OnPress Book Printing — Trim Size Formats
# Source: https://www.onpressbookprinting.com/resources/templates
#
# Each format includes:
#   trim:       Final visible page size (width × height in inches)
#   bleed:      0.125" for interiors/softcovers, 0.625" for hardcovers
#   document:   Trim + bleed on all sides (what the PDF page size should be)
#   pixels:     Document size at 300 DPI (what image files should be)
#   nanoBananaAspect: Closest supported aspect ratio for image generation
#   orientation: portrait | landscape | square
#   category:    Which section of the OnPress templates page
#   description: From OnPress — common uses for this format

# --- Universal specs (apply to all formats) ---
universal:
  bleed:
    interior: 0.125      # inches, all sides
    softcover: 0.125     # inches, all sides
    hardcover: 0.625     # inches, from canvas edge to trim
    dustJacket: 0.125    # inches, all sides
  resolution: 300        # DPI
  colorMode: CMYK
  iccProfile: GRACoL2006_Coated1v2
  outputIntent: PDF/X-1a
  safetyMargins:
    outer: 0.44          # inches, top/bottom/outside edge (from document edge)
    gutter: 1.0          # inches, binding side (from document edge)
    recommended: 0.875   # inches, OnPress recommended minimum for most trim sizes
  pageCount:
    mustBeEven: true
    padToMultipleOf: 4   # book signature requirement
    minForSpineText: 50  # softcover — spine < 0.1" below this

# --- Formats ---
formats:

  # ============ PORTRAIT ============

  pocket-book:
    name: Pocket Book
    trim: { width: 4.25, height: 6.87 }
    document: { width: 4.5, height: 7.12 }
    pixels: { width: 1350, height: 2136 }
    nanoBananaAspect: "2:3"
    orientation: portrait
    category: portrait
    description: >
      Common choice for fiction novels. Compact, easily portable.
      Popular with 60lb natural paper, black-and-white text, perfect binding.

  novella:
    name: Novella
    trim: { width: 5.0, height: 8.0 }
